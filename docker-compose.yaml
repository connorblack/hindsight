      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_SHM_SIZE: ${POSTGRES_SHM_SIZE:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8888/health >/dev/null &&
          node -e "fetch('http://127.0.0.1:9999/api/health').then(async r=>{const j=await r.json();if(!r.ok||j.dataplane?.status!=='connected')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 5m
volumes:
  postgres_data:
    # Adopt the existing migrated volume. Changing this name would start
    # Hindsight against an empty database; never remove it with `down -v`.
    name: hindsight-hermes_postgres_data
    external: true

networks:
  coolify:
    external: true
