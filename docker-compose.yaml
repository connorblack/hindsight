name: hindsight-coolify

services:
  db:
    image: timescale/timescaledb-ha:pg18-all@sha256:fef429fa767b290f7c585c4da0c32e837bbe4d98c5f50ab691b2f7338207c7ff
    restart: unless-stopped
    shm_size: 4gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATA: /home/postgres/pgdata/data
      TZ: ${TZ:-America/New_York}
    volumes:
      - postgres_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  hindsight:
    build:
      context: .
      dockerfile: docker/standalone/Dockerfile
      args:
        INCLUDE_API: "true"
        INCLUDE_CP: "true"
        INCLUDE_LOCAL_MODELS: "true"
        PRELOAD_ML_MODELS: "true"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - coolify
    expose:
      - "8888"
      - "9999"
    environment:
      HINDSIGHT_API_ACCESS_LOG: ${HINDSIGHT_API_ACCESS_LOG:-}
      HINDSIGHT_API_AUDIT_LOG_ENABLED: ${HINDSIGHT_API_AUDIT_LOG_ENABLED:-}
      HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS: ${HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE: ${HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER: ${HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY: ${HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY:?required}
      HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: ${HINDSIGHT_API_CONSOLIDATION_LLM_MODEL:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_BASE_URL: ${HINDSIGHT_API_CONSOLIDATION_LLM_BASE_URL:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_MAX_RETRIES: ${HINDSIGHT_API_CONSOLIDATION_LLM_MAX_RETRIES:-}
      HINDSIGHT_API_CONSOLIDATION_LLM_INITIAL_BACKOFF: ${HINDSIGHT_API_CONSOLIDATION_LLM_INITIAL_BACKOFF:-}
